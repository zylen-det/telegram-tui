name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify source
        run: make verify
      - name: Install pinned prebuilt TDLib
        run: make tdlib
      - name: Test TDLib integration
        run: make test-tdlib
      - name: Build release archive
        run: make package VERSION="${GITHUB_REF_NAME}"
      - name: Test one-line installer
        env:
          PREFIX: ${{ runner.temp }}/telegram-tui-install
          TELEGRAM_TUI_RELEASE_URL: file://${{ github.workspace }}/dist
          VERSION: ${{ github.ref_name }}
        run: |
          cat scripts/install.sh | sh
          test "$("${PREFIX}/bin/telegram-tui" --version)" = "${VERSION}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes
          fi
