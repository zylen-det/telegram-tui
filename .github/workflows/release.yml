name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify source
        run: make verify
      - name: Install pinned prebuilt TDLib
        run: make tdlib
      - name: Test TDLib integration
        run: make test-tdlib
      - name: Build release archive
        run: make package VERSION="${VERSION}"
      - name: Test one-line installer
        env:
          PREFIX: ${{ runner.temp }}/telegram-tui-install
          TELEGRAM_TUI_RELEASE_URL: file://${{ github.workspace }}/dist
        run: |
          cat scripts/install.sh | sh
          test "$("${PREFIX}/bin/telegram-tui" --version)" = "${VERSION}"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${VERSION}" dist/*.tar.gz dist/SHA256SUMS --clobber
