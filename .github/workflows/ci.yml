name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Shell syntax
        run: |
          bash -n scripts/build-tdlib.sh scripts/install-tdlib-prebuilt.sh scripts/package-release.sh
          sh -n scripts/install.sh
      - name: Format
        run: make fmt
      - name: Unit tests
        run: make test
      - name: Race detector
        env:
          CGO_ENABLED: "1"
        run: make race
      - name: Vet
        run: make vet

  tdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned prebuilt TDLib
        run: make tdlib
      - name: Test TDLib integration
        run: make test-tdlib
      - name: Build production binary
        run: make build
      - name: Check binary
        run: ./bin/telegram-tui --version
